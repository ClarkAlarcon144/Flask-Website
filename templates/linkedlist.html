{% extends "base.html" %}


{% block styles%}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/linkedlist.css') }}">
{% endblock %}


{% block content %}

    <h2>Linked List</h2>

    <div class="ll-layout">

        <div class="controls">
            <form action="/works/linkedlist" method="post">

                <input type="text" name="inputString">

                <input type="submit" name="action" value="Insert Beginning">
                <input type="submit" name="action" value="Insert End">
                
                <div class="insert-after">
                    <input type="submit" name="action" value="Insert After">
                    <input type="text" name="position">
                </div>

                <input type="submit" name="action" value="Remove Beginning">
                <input type="submit" name="action" value="Remove End">
                <input type="submit" name="action" value="Remove">

            </form>
        </div>

        {% if result %}
            <div class="linked-list">

                {% for value in result %}

                    <div class="node-box">
                        {{ value }}
                    </div>

                    {% if not loop.last %}
                        <div class="arrow">↓</div>
                    {% endif %}

                {% endfor %}

            </div>
        {% endif %}

    </div>

{% endblock %}
