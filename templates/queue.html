{% extends "base.html" %}


{% block styles%}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/queue.css') }}">
{% endblock %}


{% block content %}

    <h2>Queue</h2>

    <div class="queue-layout">

        <div class="controls">
            <form action="/works/queue" method="post">

                <input type="text" name="inputString">

                <input type="submit" name="action" value="Enqueue">
                <input type="submit" name="action" value="Dequeue">
                
            </form>
        </div>

        {% if result %}
            <div class="queue">

                {% for value in result %}
                    <div class="node-box">
                        {{ value }}
                    </div>

                    {% if not loop.last %}
                        <div class="arrow">→</div>
                    {% endif %}

                {% endfor %}

            </div>
        {% endif %}

    </div>

{% endblock %}
