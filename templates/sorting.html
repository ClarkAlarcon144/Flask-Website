
{% extends "base.html" %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sorting.css') }}">
{% endblock %}

{% block content %}

<h2>Sorting Visualizer</h2>

<div class="sorting-layout">

    <div class="controls">

        <form action="/works/sorting" method="POST">

            <input
                type="text"
                name="inputString"
                placeholder="Enter numbers: 5, 2, 8, 1, 9"
                value="{{ request.form.get('inputString', '') }}"
                required
            >

            <div class="sorting-buttons">

                <button name="action" value="bubble">
                    Bubble Sort
                </button>

                <button name="action" value="selection">
                    Selection Sort
                </button>

                <button name="action" value="insertion">
                    Insertion Sort
                </button>

                <button name="action" value="merge">
                    Merge Sort
                </button>

                <button name="action" value="quick">
                    Quick Sort
                </button>

            </div>

        </form>

    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="visualizer">

        <h3 id="algorithm-name"></h3>

        <div id="bars" class="bars"></div>

        <p id="status">Enter numbers and select an algorithm.</p>

    </div>

</div>

<script>
    const numbers = {{ numbers | tojson }};
    const algorithm = {{ selected_algorithm | tojson }};
</script>

<script src="{{ url_for('static', filename='js/sorting.js') }}"></script>

{% endblock %}
