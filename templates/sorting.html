
{% extends "base.html" %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sorting.css') }}">
{% endblock %}


{% block content %}

    <h2>Sorting</h2>

    <div class="sorting-layout">

        <div class="controls">

            <form action="/works/sorting" method="post">

                <input
                    type="text"
                    name="inputString"
                    placeholder="Enter numbers (e.g. 5, 2, 8, 1, 9)"
                >

                <div class="sorting-buttons">

                    <button type="submit" name="action" value="bubble">
                        Bubble Sort
                    </button>

                    <button type="submit" name="action" value="selection">
                        Selection Sort
                    </button>

                    <button type="submit" name="action" value="insertion">
                        Insertion Sort
                    </button>

                    <button type="submit" name="action" value="merge">
                        Merge Sort
                    </button>

                    <button type="submit" name="action" value="quick">
                        Quick Sort
                    </button>

                </div>

            </form>

        </div>


        {% if result %}

            <div class="sorting">

                {% for value in result %}

                    <div class="node-box">
                        {{ value }}
                    </div>

                    {% if not loop.last %}
                        <div class="arrow">→</div>
                    {% endif %}

                {% endfor %}

            </div>

        {% endif %}

    </div>

{% endblock %}
