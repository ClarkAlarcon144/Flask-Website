<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 20px;
            background: #f5f0ff;
            color: #2d2340;
        }

        nav {
            background: #8e6bbd;
            padding: 18px 40px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            margin: 0%;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 40px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #eadcff;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(90, 60, 120, 0.15);
        }

        h1, h2, h3 {
            color: #6f4b9b;
        }

        h1 {
            font-size: 42px;
        }

        h2 {
            font-size: 32px;
        }

        p {
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #d8c7ed;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #8e6bbd;
        }

        input[type="submit"] {
            margin-top: 10px;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #8e6bbd;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="submit"]:hover {
            background: #6f4b9b;
        }

        a {
            color: #7652a5;
        }

        .result {
            margin-top: 25px;
            padding: 15px 20px;
            background: #eee4ff;
            border-left: 5px solid #8e6bbd;
            border-radius: 8px;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 30px 0;
        }

        .work-card a {
            display: block;
            padding: 30px;
            background: #eee4ff;
            border: 2px solid #d8c7ed;
            border-radius: 15px;
            color: #6f4b9b;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        .work-card a:hover {
            background: #dfd0f5;
            border-color: #8e6bbd;
            transform: translateY(-4px);
            box-shadow: 0 5px 12px rgba(90, 60, 120, 0.15);
        }

        {% block styles %}
        {% endblock %}
    
    </style>
    
</head>

<body>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
</body>
</html>
